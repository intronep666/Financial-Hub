name: CI

on:
  push:
    branches: [ "main", "improve/performance-infra" ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings
      - name: Static checks
        run: |
          python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  integration:
    name: Integration (Docker Compose smoke tests)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Compose
        run: |
          docker --version
          docker compose version
      - name: Start Docker Compose stack
        run: |
          docker compose up --build -d
      - name: Wait for backend to be healthy
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          for i in `seq 1 40`; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$status" = "200" ]; then
              echo "Backend healthy" && break
            fi
            echo "Waiting for backend... ($i)"
            sleep 3
          done
      - name: Run smoke tests
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh
      - name: Check frontend runtime env-config
        run: |
          curl -s http://localhost:3000/env-config.js | grep -q 'VITE_API_URL' || (echo 'env-config.js missing or does not contain VITE_API_URL' && exit 1)
      - name: Check materialized view and index
        run: |
          chmod +x ./scripts/check_matview.sh
          ./scripts/check_matview.sh
      - name: Tear down compose
        if: always()
        run: docker compose down
